name: Godot Linux headless (controlli prima del rilascio)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recupera il repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Installa dipendenze Linux
        run: sudo apt-get update && sudo apt-get install -y unzip libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 libgl1
      - name: Installa Godot 4.7.2 (stessa versione del builder Windows)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -j /tmp/godot.zip -d /tmp/godot-bin
          find /tmp/godot-bin -type f -maxdepth 1 -print
          GODOT_FILE="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*linux.x86_64*' | head -n 1)"
          test -n "$GODOT_FILE"
          chmod +x "$GODOT_FILE"
          echo "GODOT_BIN=$GODOT_FILE" >> "$GITHUB_ENV"
          "$GODOT_FILE" --version
      - name: Importa e avvia il gioco senza grafica
        shell: bash
        run: bash tools/VERIFICA_LINUX.sh
      - name: Esporta candidata Windows x86_64
        shell: bash
        run: bash tools/ESPORTA_CANDIDATA_LINUX.sh
      - name: Conserva candidata Windows per il collaudo
        uses: actions/upload-artifact@v4
        with:
          name: UltimoRifugio-candidata-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/candidata-windows/
          retention-days: 30
          if-no-files-found: error

  windows-smoke:
    needs: godot-smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Scarica la candidata appena esportata
        uses: actions/download-artifact@v4
        with:
          name: UltimoRifugio-candidata-Windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidata
      - name: Avvio, salvataggio e riapertura Windows headless
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path candidata).Path
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'ur-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ur-localappdata'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          Push-Location $folder
          try {
            foreach ($stage in @('avvio','riapertura')) {
              $out = Join-Path $env:RUNNER_TEMP "$stage-out.log"
              $err = Join-Path $env:RUNNER_TEMP "$stage-err.log"
              $process = Start-Process -FilePath (Join-Path $folder 'UltimoRifugio.exe') -ArgumentList '--headless --audio-driver Dummy --quit-after 15' -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
              Get-Content $out, $err
              if ($process.ExitCode -ne 0) { throw "Avvio Windows fallito: $($process.ExitCode)" }
              if (Select-String -Path $out,$err -Pattern 'ERROR:|Parse Error:|FATAL:') { throw 'Errori Godot Windows' }
              $save = Join-Path $folder 'salvataggi/partita.json'
              if (-not (Test-Path $save)) { throw 'Salvataggio portatile Windows mancante' }
              $data = Get-Content $save -Raw | ConvertFrom-Json
              if ($data.version -ne 8 -or $null -eq $data.salvage -or $null -eq $data.wall_hp -or $null -eq $data.expedition -or $null -eq $data.frontier -or $data.development_cycle -ne 15 -or $data.base_level -ne 1) { throw 'Salvataggio Windows incompleto' }
            }
          } finally { Pop-Location }
          Write-Host 'OK: candidata Windows avviata e riaperta con salvataggio v8. Rendering interattivo da collaudare.'

      - name: Recupera soltanto i sorgenti dei test per il PCK Windows
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source-tests
      - name: Difese e percorso demo sul PCK esportato e motore Windows 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'demo-appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'demo-localappdata'
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $engineFolder = Join-Path $env:RUNNER_TEMP 'godot-windows-472'
          $engineZip = Join-Path $env:RUNNER_TEMP 'godot-windows-472.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $engineZip
          Expand-Archive -Path $engineZip -DestinationPath $engineFolder
          $engine = (Get-ChildItem $engineFolder -Filter 'Godot*_win64.exe' | Select-Object -First 1).FullName
          if (-not $engine) { throw 'Motore ufficiale Windows 4.7.2 mancante' }
          # --script e --main-pack non sono disponibili nei template release.
          # L'EXE release e' gia verificato sopra; qui si usa lo stesso PCK esportato.
          foreach ($suite in @('defense_integrity_and_alerts','frontier_progression')) {
            $isolated = Join-Path $env:RUNNER_TEMP "demo-$suite"
            New-Item -ItemType Directory -Force $isolated | Out-Null
            Copy-Item candidata/UltimoRifugio.exe,candidata/UltimoRifugio.pck,candidata/CANDIDATA_PORTATILE.txt,candidata/COMMIT.txt $isolated
            $script = (Resolve-Path "source-tests/tests/$suite.gd").Path
            $out = Join-Path $env:RUNNER_TEMP "$suite-out.log"
            $err = Join-Path $env:RUNNER_TEMP "$suite-err.log"
            $pack = Join-Path $isolated 'UltimoRifugio.pck'
            $env:ULTIMO_RIFUGIO_TEST_DATA = Join-Path $isolated 'test-data'
            $process = Start-Process -FilePath $engine -ArgumentList @('--headless','--audio-driver','Dummy','--main-pack',$pack,'--script',$script) -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force
              Get-Content $out,$err
              throw "Suite $suite: timeout"
            }
            Get-Content $out,$err
            if ($process.ExitCode -ne 0) { throw "Suite Windows $suite fallita: $($process.ExitCode)" }
            if (Select-String -Path $out,$err -Pattern 'ERROR:|Parse Error:|FATAL:') { throw "Errori Godot Windows: $suite" }
          }
          Write-Host 'OK: scansioni difese e progressione completa demo eseguite anche sul PCK esportato con Godot Windows 4.7.2.'
