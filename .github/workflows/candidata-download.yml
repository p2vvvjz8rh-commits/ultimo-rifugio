name: Download stabile della candidata verificata

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/candidata-download.yml]

permissions:
  contents: write
  actions: read

jobs:
  download-stabile:
    if: github.repository == 'p2vvvjz8rh-commits/ultimo-rifugio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sviluppo-agenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ee5c659ee19145bd0298bace236ffeddd29d6e63
      CANDIDATE_TAG: candidata-base-visuale-ee5c659
      VERIFIED_RUN: '43924712760'
    steps:
      - name: Verifica provenienza e controlli della candidata originale
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
      - name: Recupera esattamente il pacchetto gia collaudato automaticamente
        uses: actions/download-artifact@v4
        with:
          name: UltimoRifugio-candidata-Windows-ee5c659ee19145bd0298bace236ffeddd29d6e63
          run-id: 43924712760
          github-token: ${{ github.token }}
          path: candidata
      - name: Verifica file e crea lo ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, os, zipfile
          folder = pathlib.Path('candidata')
          assert (folder/'COMMIT.txt').read_text().strip() == os.environ['CANDIDATE_SHA']
          assert (folder/'CANDIDATA_PORTATILE.txt').is_file()
          for line in (folder/'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest() == digest
          archive = pathlib.Path('UltimoRifugio-candidata-base-visuale-ee5c659.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(folder.iterdir()):
                  assert item.is_file(), 'Il pacchetto deve essere privo di salvataggi locali'
                  bundle.write(item, item.name)
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
          PY
      - name: Rendi scaricabile la candidata senza modificare main
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La prerelease esiste gia: non viene sovrascritta.'
            exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$CANDIDATE_SHA"
          cat > note-candidata.txt <<'NOTES'
          Pacchetto separato per il collaudo di movimento, inquadratura e visibilita delle costruzioni.

          Scarica lo ZIP, estrai tutti i file in una NUOVA cartella e apri AVVIA_CANDIDATA.bat.
          Prova il movimento contro i muri, i danni visti dal cortile e la resistenza della capanna.
          Tieni premuta la rotella e trascina per spostare la visuale; Home ricentra, rotella libera mantiene lo zoom.
          Pan e zoom sono disponibili anche in pausa.

          Stessi file della candidata ee5c659 gia verificata con Godot 4.7.2, test Linux, esportazione e avvio/salvataggio/riapertura Windows headless. Ricontrollati i checksum del pacchetto originale.
          Capanna: danni ricevuti ridotti del 65%, HP massimi e salvataggi v8 invariati.
          Conservate le meccaniche precedentemente collaudate di cancello, riparazioni e recupero.
          Conservare CANDIDATA_PORTATILE.txt per mantenere separati i dati del collaudo.

          Prerelease di collaudo: non sostituisce Alfa 13. Nessun merge in main e nessun aggiornamento automatico.
          NOTES
          gh release create "$CANDIDATE_TAG" UltimoRifugio-candidata-base-visuale-ee5c659.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title 'Candidata base e visuale ee5c659 — solo collaudo' \
            --notes-file note-candidata.txt
