name: Pacchetto verificato demo estesa e download con tag

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/candidata-download.yml]

permissions:
  contents: write
  actions: read

jobs:
  download-stabile:
    if: github.repository == 'p2vvvjz8rh-commits/ultimo-rifugio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sviluppo-agenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: adba17f1dd63ba64f853cb14c7b31a9419e3a3ff
      CANDIDATE_TAG: demo-estesa-adba17f
      VERIFIED_RUN: '44282845926'
    steps:
      - name: Verifica provenienza e controlli della candidata originale
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
      - name: Recupera esattamente il pacchetto gia collaudato automaticamente
        uses: actions/download-artifact@v4
        with:
          name: UltimoRifugio-candidata-Windows-adba17f1dd63ba64f853cb14c7b31a9419e3a3ff
          run-id: 44282845926
          github-token: ${{ github.token }}
          path: candidata
      - name: Verifica file e crea lo ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, os, zipfile
          folder = pathlib.Path('candidata')
          assert (folder/'COMMIT.txt').read_text().strip() == os.environ['CANDIDATE_SHA']
          assert (folder/'CANDIDATA_PORTATILE.txt').is_file()
          for line in (folder/'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest() == digest
          archive = pathlib.Path('UltimoRifugio-DemoEstesa-Windows-adba17f.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(folder.iterdir()):
                  assert item.is_file(), 'Il pacchetto deve essere privo di salvataggi locali'
                  bundle.write(item, item.name)
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
          PY
      - name: Conserva il pacchetto verificato senza scadenze di link temporanei
        uses: actions/upload-artifact@v4
        with:
          name: DemoEstesa-Windows-adba17f-files
          path: candidata/*
          retention-days: 90
      - name: Pubblica solo se il tag candidato e gia disponibile
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La prerelease esiste gia: non viene sovrascritta.'
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo 'Tag assente: nessuna release creata. Pacchetto verificato e conservato come artefatto, consegna diretta dello ZIP al tester.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$CANDIDATE_SHA"
          cat > note-candidata.txt <<'NOTES'
          Demo estesa Alfa 15: candidata separata, senza aggiornare la versione stabile.

          Scarica lo ZIP ed estrai TUTTO in una NUOVA cartella. Avvia AVVIA_CANDIDATA.bat.
          Conserva CANDIDATA_PORTATILE.txt per mantenere i salvataggi accanto alla demo.
          PROVA DEMO ESTESA permette di iniziare il nuovo ciclo con cortile ampliato:
          conserva la partita precedente in backup e lascia le nuove attivita da completare.
          Puoi anche proseguire dall'inizio o usare una COPIA del salvataggio della candidata precedente.

          Correzioni: allarmi distinti per orde e difese con zona; riparazioni individuali al 100%
          e costo proporzionale; Ripara tutto coerente; corretti giunti fisici e generazione zombie
          nel cortile ampliato. Carretto, ampliamento, movimento e camera conservati.

          Nuovo ciclo integrato: tre spedizioni, recuperi facoltativi e scelte di rischio/carico,
          officina, magazzino e generatore fisici, attrezzi e kit da campo. G alla bacheca; H usa kit.
          Le costruzioni hanno salute, deterioramento geometrico, crollo e riparazioni individuali.
          Contenuti narrativi aggiuntivi da scoprire solo nel gioco.

          Verifiche Godot 4.7.2: tutte le suite Linux, 1840 scansioni fisiche delle difese,
          compatibilita v8 e backup, progressione completa delle spedizioni, esportazione,
          doppio avvio dell'EXE Windows e suite sul PCK esportato con motore Windows ufficiale.
          Controllo grafico Linux eseguito. Resa, prestazioni e durata in una partita Windows
          restano da collaudare: nessuna durata in minuti viene dichiarata senza misurazione.

          Main e Alfa 14 restano invariati. Prerelease di collaudo, mai sostituire la cartella stabile.
          NOTES
          gh release create "$CANDIDATE_TAG" UltimoRifugio-DemoEstesa-Windows-adba17f.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title 'Demo estesa Alfa 15 adba17f — solo collaudo' \
            --notes-file note-candidata.txt
