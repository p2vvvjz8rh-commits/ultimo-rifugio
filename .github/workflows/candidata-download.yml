name: Download stabile della candidata verificata

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/candidata-download.yml]

permissions:
  contents: write
  actions: read

jobs:
  download-stabile:
    if: github.repository == 'p2vvvjz8rh-commits/ultimo-rifugio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sviluppo-agenti'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: 9b77f62f137a4432f21c4c81d3d5301a19ebd9c6
      CANDIDATE_TAG: candidata-alfa15-9b77f62
      VERIFIED_RUN: '44140024752'
    steps:
      - name: Verifica provenienza e controlli della candidata originale
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$CANDIDATE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
      - name: Recupera esattamente il pacchetto gia collaudato automaticamente
        uses: actions/download-artifact@v4
        with:
          name: UltimoRifugio-candidata-Windows-9b77f62f137a4432f21c4c81d3d5301a19ebd9c6
          run-id: 44140024752
          github-token: ${{ github.token }}
          path: candidata
      - name: Verifica file e crea lo ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib, hashlib, os, zipfile
          folder = pathlib.Path('candidata')
          assert (folder/'COMMIT.txt').read_text().strip() == os.environ['CANDIDATE_SHA']
          assert (folder/'CANDIDATA_PORTATILE.txt').is_file()
          for line in (folder/'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest() == digest
          archive = pathlib.Path('UltimoRifugio-Alfa15-candidata-9b77f62.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as bundle:
              for item in sorted(folder.iterdir()):
                  assert item.is_file(), 'Il pacchetto deve essere privo di salvataggi locali'
                  bundle.write(item, item.name)
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
          PY
      - name: Rendi scaricabile la candidata senza modificare main
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La prerelease esiste gia: non viene sovrascritta.'
            exit 0
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$CANDIDATE_SHA"
          cat > note-candidata.txt <<'NOTES'
          Alfa 15 candidata: scorta di materiali e ampliamento del cortile.

          Scarica lo ZIP, estrai tutto in una NUOVA cartella e avvia AVVIA_CANDIDATA.bat.
          Alfa 14 rimane la versione stabile: nessun aggiornamento automatico e nessun merge in main.
          Conserva CANDIDATA_PORTATILE.txt per isolare i dati del collaudo.

          Prova breve: costruisci la palizzata, raggiungi il carretto a SUD-EST e premi F.
          Resta vicino al carico e proteggilo fino alla consegna davanti al cancello.
          Verifica anche il nuovo tentativo dopo una perdita e la ripresa dopo chiusura del gioco.
          Il primo recupero sblocca l'ampliamento al banco (E), al costo di 120 legno e 60 monete.
          Dopo l'ampliamento prova accesso al cancello, riparazioni e riapertura della partita.
          F3 offre risorse e comandi di prova per abbreviare il collaudo.

          Controlli automatici Godot 4.7.2: suite Linux, compatibilita JSON v8,
          backup protettivi, esportazione e avvio/salvataggio/riapertura Windows headless.
          Rendering della base ampliata controllato su Linux; resa e ritmo su Windows da collaudare.
          I salvataggi precedenti restano compatibili, con backup pre Alfa 15 prima dei nuovi campi.
          Nessuna modifica narrativa in questa candidata.
          NOTES
          gh release create "$CANDIDATE_TAG" UltimoRifugio-Alfa15-candidata-9b77f62.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title 'Alfa 15 candidata 9b77f62 — scorta e ampliamento' \
            --notes-file note-candidata.txt
